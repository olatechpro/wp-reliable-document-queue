name: WordPress integration smoke test
on:
  push:
  pull_request:
jobs:
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli, composer
          extensions: zip
      - name: Install WordPress
        run: |
          wp core download --path=/tmp/wp --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --path=/tmp/wp --url=http://localhost --title=Demo --admin_user=admin --admin_password=temporary-test-password --admin_email=admin@example.test --skip-email --allow-root
          php scripts/build-zip.php
          zip_file="$(find dist -maxdepth 1 -name 'wp-reliable-document-queue-*.zip' -type f | sort -V | tail -n 1)"
          wp plugin install "$zip_file" --activate --path=/tmp/wp --allow-root
          wp eval 'if ( ! function_exists( "as_enqueue_async_action" ) ) { throw new RuntimeException( "Bundled Action Scheduler unavailable" ); }' --path=/tmp/wp --allow-root
      - name: Exercise Action Scheduler
        run: |
          wp eval "wrdq_enqueue_document('ci-demo-001'); wrdq_enqueue_document('ci-demo-001');" --path=/tmp/wp --allow-root
          wp action-scheduler run --batch-size=100 --path=/tmp/wp --allow-root
          wp eval-file "$GITHUB_WORKSPACE/tests/wp-smoke.php" --path=/tmp/wp --allow-root
          wp plugin install woocommerce --activate --path=/tmp/wp --allow-root
          wp eval "wrdq_enqueue_document('ci-with-woocommerce');" --path=/tmp/wp --allow-root
          wp action-scheduler run --batch-size=100 --path=/tmp/wp --allow-root
